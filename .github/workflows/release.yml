# Tag-triggered release: build Barik with Xcode (Release, unsigned) on a macOS
# runner, attach Barik.zip to a GitHub Release, then bump release.json on main
# with the new version/url/sha256 so this repo's flake installs the fresh
# artifact.
#
# Usage: push a tag like `v0.5.1-ut.2`. Consumers (e.g. UTshion/dotnix, which
# takes this repo as a flake input) then just run
# `nix flake lock --update-input barik` — no manual hash bookkeeping.
#
# Why the post-release commit: the flake at the tagged commit cannot contain the
# hash of an artifact built *from* that commit (chicken-and-egg), so the flake
# always points at the latest *published* release via release.json, and CI moves
# that pointer after uploading.
name: Release Barik

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Barik.app (unsigned Release)
        run: |
          set -euo pipefail
          DERIVED="$RUNNER_TEMP/DerivedData"
          xcodebuild \
            -project Barik.xcodeproj \
            -scheme Barik \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            build
          APP="$(find "$DERIVED" -name Barik.app -type d -print -quit)"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Barik.zip
          ls -la Barik.zip

      - name: Create release and upload Barik.zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Barik ${{ github.ref_name }}
          files: Barik.zip
          generate_release_notes: true

      # Safe against workflow loops: this workflow only triggers on tag pushes,
      # and the bump commit is a plain branch push.
      - name: Point release.json at this release (commit to main)
        run: |
          set -euo pipefail
          HASH="sha256-$(openssl dgst -sha256 -binary Barik.zip | base64)"
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Barik.zip"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          jq --arg v "$VERSION" --arg u "$URL" --arg h "$HASH" \
            '.version = $v | .url = $u | .hash = $h' release.json > release.json.tmp
          mv release.json.tmp release.json
          git add release.json
          git commit -m "release: point release.json at ${GITHUB_REF_NAME}"
          git push origin main
